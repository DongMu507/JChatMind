  datasource:
    url: jdbc:postgresql://localhost:5432/jchatmind
    username: postgres
    password: Rdong6002c
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.qq.com
    port: 465
    username: 211807751@qq.com
    password: gbpxxdseqwoxbhhh
    protocol: smtps  # 🌟核心修改1：直接声明使用安全的 smtps 协议
    default-encoding: UTF-8
    properties:
      mail:
        smtps: # 🌟核心修改2：这里的属性前缀也跟着变成 smtps
          auth: true
          ssl:
            enable: true
          timeout: 10000 # 增加超时时间，防止网络波动
  ai:
    deepseek:
      api-key: sk-064c94a19eb749abb41e894103bacfcd
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    zhipuai:
      api-key: 2f4a46d652244b21b3cd6ccd60e70270.91B2eElV9ayDWFiw
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6

zhipu:
  api:
    key: ${spring.ai.zhipuai.api-key}
    rerank-url: https://open.bigmodel.cn/api/paas/v4/rerank
    rerank-model: glm-4-reranker

llm:
  embedding:
    base-url: http://localhost:11434
    model: bge-m3
  memory:
    summary-chat-client-bean: deepseek-chat
    fallback-chat-client-bean: glm-4.6

mybatis:
  type-aliases-package: com.kama.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jchatmind.typehandler

document:
  storage:
    base-path: ./data/documents

server:
  shutdown: graceful # 启用优雅停机

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true
    key-values:
      application: ${spring.application.name}
      env: local
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ./logs/jchatmind.log
  pattern:
    correlation: "[traceId=%X{traceId:-},spanId=%X{spanId:-}] "
